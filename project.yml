name: LaunchWindow
options:
  bundleIdPrefix: studio.mikegyver
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "5"
targets:
  LaunchWindow:
    type: application
    platform: iOS
    sources:
      - path: LaunchWindow
        excludes:
          - Info.plist
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.mikegyver.launchwindow
        INFOPLIST_FILE: LaunchWindow/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        CODE_SIGN_ENTITLEMENTS: LaunchWindow/LaunchWindow.entitlements
        PROVISIONING_PROFILE_SPECIFIER: ${APP_PROFILE_UUID}
        DEVELOPMENT_TEAM: ${TEAM_ID}
    dependencies:
      - target: LaunchWidget
        embed: true
  LaunchWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: LaunchWidget
        excludes:
          - Info.plist
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.mikegyver.launchwindow.widget
        INFOPLIST_FILE: LaunchWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        CODE_SIGN_ENTITLEMENTS: LaunchWidget/LaunchWidget.entitlements
        PROVISIONING_PROFILE_SPECIFIER: ${WIDGET_PROFILE_UUID}
        DEVELOPMENT_TEAM: ${TEAM_ID}
        APPLICATION_EXTENSION_API_ONLY: YES
